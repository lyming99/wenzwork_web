syntax = "proto3";

package remote.v2;

option go_package = "github.com/wenzwork/wenzwork-web/server/internal/generated/remote/v2;remotev2";

import "google/protobuf/timestamp.proto";
import "remote/v2/common.proto";

message RpcRequest {
  string operation_id = 501;
  string attempt_id = 502;
  string method = 503;
  google.protobuf.Timestamp deadline = 504;
  optional uint64 expected_revision = 505;
  bytes payload = 506;
}

message RpcResponse {
  string operation_id = 511;
  string attempt_id = 512;
  uint64 revision = 513;
  ProtocolErrorCode error_code = 514;
  bool replayed = 515;
  bytes payload = 516;
  string safe_error_code = 517;
  bool retryable = 518;
  uint32 retry_after_seconds = 519;
}

message RpcEvent {
  string operation_id = 521;
  uint64 event_sequence = 522;
  bytes payload = 523;
  // Stable UUID generated by the device.  It lets consumers deduplicate a
  // replayed encrypted event without fabricating an identifier from Link or
  // Stream routing metadata.
  string event_id = 524;
  // The highest durable sequence represented by this event.  It is distinct
  // from event_sequence because control events deliberately use sequence 0.
  uint64 high_watermark = 525;
}

message FileManifest {
  string transfer_id = 531;
  uint64 total_length = 532;
  uint32 chunk_size = 533;
  bytes sha256 = 534;
  string relative_path_handle = 535;
  uint64 expected_revision = 536;
}

message FileChunk {
  string transfer_id = 541;
  uint64 index = 542;
  bytes chunk_hash = 543;
  bytes payload = 544;
}

message FileAck {
  string transfer_id = 551;
  repeated uint64 confirmed_indexes = 552;
  bytes confirmed_bitmap = 553;
}

message FileCommit {
  string transfer_id = 561;
  bytes sha256 = 562;
  uint64 expected_revision = 563;
}

message EventSubscribe {
  string subscription_id = 571;
  uint64 after_sequence = 572;
}

message EventAck {
  string subscription_id = 581;
  uint64 high_watermark = 582;
}

message EventResume {
  string subscription_id = 591;
  uint64 after_sequence = 592;
}

message EventResetRequired {
  string subscription_id = 601;
  uint64 current_high_watermark = 602;
}

// Terminal v4 uses one long-lived STREAM_KIND_TERMINAL Stream per PTY attach.
// Application sequences are independent from EncryptedRecord.stream_sequence:
// they survive Carrier recovery and make replay/idempotency explicit.
message TerminalStreamHello {
  uint64 after_output_sequence = 611;
  uint64 after_input_sequence = 612;
  uint64 after_resize_sequence = 613;
  uint32 output_credit_bytes = 614;
}

message TerminalInput {
  uint64 sequence = 621;
  bytes data = 622;
}

message TerminalResize {
  uint64 sequence = 631;
  uint32 rows = 632;
  uint32 columns = 633;
}

message TerminalSignal {
  uint64 input_sequence = 641;
  string signal = 642;
}

message TerminalClose {
  string reason = 651;
}

message TerminalOutput {
  uint64 sequence = 661;
  bytes data = 662;
}

message TerminalExit {
  uint64 sequence = 671;
  sint32 exit_code = 672;
  string reason = 673;
}

message TerminalInputAck {
  uint64 through_sequence = 681;
}

message TerminalResizeAck {
  uint64 through_sequence = 691;
}

// credit_bytes is incremental credit, not an absolute window. The receiver
// must cap the resulting window and reject credit inflation.
message TerminalWindowUpdate {
  uint32 credit_bytes = 701;
}

message TerminalOutputAck {
  uint64 through_sequence = 711;
  uint32 credit_bytes = 712;
}

message TerminalReset {
  uint64 first_sequence = 721;
  uint64 high_watermark = 722;
}

message TerminalStreamFrame {
  string session_id = 731;
  oneof body {
    TerminalStreamHello hello = 740;
    TerminalInput input = 741;
    TerminalResize resize = 742;
    TerminalSignal signal = 743;
    TerminalClose close = 744;
    TerminalOutput output = 745;
    TerminalExit exit = 746;
    TerminalInputAck input_ack = 747;
    TerminalResizeAck resize_ack = 748;
    TerminalWindowUpdate window_update = 749;
    TerminalOutputAck output_ack = 750;
    TerminalReset reset = 751;
  }
}
