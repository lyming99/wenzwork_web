syntax = "proto3";

package remote.v1;

option go_package = "github.com/wenzwork/wenzwork-web/server/internal/generated/remote/v1;remotev1";

// ErrorCode is stable across REST, Relay and Agent implementations. Error
// details must never contain tokens, prompts, file names, paths or payloads.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_PROTOCOL_UNSUPPORTED = 1;
  ERROR_CODE_FRAME_INVALID = 2;
  ERROR_CODE_FRAME_TOO_LARGE = 3;
  ERROR_CODE_TICKET_INVALID = 4;
  ERROR_CODE_TICKET_EXPIRED = 5;
  ERROR_CODE_ASSIGNMENT_STALE = 6;
  ERROR_CODE_GRANT_REVOKED = 7;
  ERROR_CODE_DEVICE_OFFLINE = 8;
  ERROR_CODE_ROUTE_STALE = 9;
  ERROR_CODE_RATE_LIMITED = 10;
  ERROR_CODE_RELAY_OVERLOADED = 11;
  ERROR_CODE_COMMAND_EXPIRED = 12;
  ERROR_CODE_REVISION_CONFLICT = 13;
  ERROR_CODE_CAPABILITY_MISSING = 14;
  ERROR_CODE_PEER_OFFLINE = 15;
  ERROR_CODE_PEER_TIMEOUT = 16;
  ERROR_CODE_PEER_INTERRUPTED = 17;
  ERROR_CODE_FILE_TARGET_OFFLINE = 18;
  ERROR_CODE_FILE_REJECTED = 19;
  ERROR_CODE_FILE_TICKET_INVALID = 20;
  ERROR_CODE_FILE_TICKET_EXPIRED = 21;
  ERROR_CODE_FILE_GRANT_REVOKED = 22;
  ERROR_CODE_FILE_CAPABILITY_MISSING = 23;
  ERROR_CODE_FILE_RATE_LIMITED = 24;
  ERROR_CODE_FILE_QUOTA_EXCEEDED = 25;
  ERROR_CODE_FILE_INTERRUPTED = 26;
  ERROR_CODE_FILE_RESUME_EXPIRED = 27;
  ERROR_CODE_FILE_SOURCE_CHANGED = 28;
  ERROR_CODE_FILE_TARGET_STORAGE_FULL = 29;
  ERROR_CODE_FILE_MANIFEST_INVALID = 30;
  ERROR_CODE_FILE_PATH_REJECTED = 31;
  ERROR_CODE_FILE_INTEGRITY_FAILED = 32;
  ERROR_CODE_FILE_SECURITY_SCAN_FAILED = 33;
  ERROR_CODE_FILE_CANCELLED = 34;
}
