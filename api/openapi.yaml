        type: string
        format: uuid
    RemoteTaskID:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RemoteCommandID:
      name: commandId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RemoteAccessKeyID:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RemoteControllerID:
