      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: 请求失败
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OAuthError:
      description: OAuth 或设备授权请求失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
    AcceptedOperation:
      description: 异步操作已持久化；响应不代表设备或中继节点已完成处理
      headers:
        Location:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AsyncOperationResponse"
    RelayBootstrapShellAsset:
      description: 公开的 Relay Bash 资产；响应禁止缓存
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        text/x-shellscript:
          schema:
            type: string
    RelayBootstrapTextAsset:
      description: 公开的 Relay PowerShell 或文本资产；响应禁止缓存
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        text/plain:
          schema:
            type: string
    RelayBootstrapChecksum:
      description: 对应 bootstrap 资产的动态 SHA-256；响应禁止缓存
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        text/plain:
          schema:
            type: string
            pattern: "^[0-9a-f]{64}  [^\\r\\n]+\\n$"
    RelayBootstrapBinary:
      description: 与目标平台和架构匹配的公开 relayctl 引导验证器；响应禁止缓存
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]
    Problem:
      type: object
      required: [type, title, status, code]
      description: 符合 RFC 9457 的问题详情；面向人员的标题和详情使用中文，稳定错误码保持英文机器标识。
      example:
        type: https://wenzwork.com/problems/relay-cell-unavailable
        title: 中继组暂时不可用
        status: 503
        detail: 当前中继组没有可接入的中继节点，请稍后重试。
        code: relay_cell_unavailable
        requestId: 00000000-0000-4000-8000-000000000001
      properties:
        type:
          type: string
          format: uri
          description: 问题类型 URI。
        title:
          type: string
          description: 面向人员的中文问题标题。
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP 状态码。
        detail:
          type: string
          description: 面向人员的中文问题详情。
        code:
          type: string
          description: 供程序判断的稳定英文错误码，不随展示语言变化。
        requestId:
          type: string
          format: uuid
          description: 用于日志追踪的请求编号。
    PricingPlanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PricingPlan"
    PricingPlan:
