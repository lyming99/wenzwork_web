  /remote/controllers/{controllerId}/device-links:
    servers:
      - url: /api/v2
        description: remote/v2 Control Plane
    post:
      tags: [RemoteControl]
      operationId: createDeviceLink
      summary: 为 Client–Device 加密 Link 签发长期设备级连接口令
      description: |
        此接口不接受 projectId 或业务 Scope。响应中的 deviceConnectionGrant 只能放入
        二进制 CARRIER_HELLO/LINK_INIT，并且 Relay 与 Device 都会验证 Client Ed25519 持钥证明。
        默认口令可跨 Carrier 重连复用，不设置周期性续签期限；它仍受显式撤销、Controller/Device
        身份版本、设备授权版本及 Relay Cell/Node 绑定约束。禁止将其放入 URL、WebSocket 子协议、
        日志或 UI 状态树；Client 只可在受保护的本地内存/凭据存储中缓存。
      security:
        - sessionCookie: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RemoteControllerID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceLinkRequest"
      responses:
        "201":
          description: 绑定 Client 身份、目标设备与稳定 Relay 路由的长期 PoP Grant
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLinkResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /remote/controllers/{controllerId}/device-links/{grantId}:
    servers:
      - url: /api/v2
        description: remote/v2 Control Plane
    delete:
      tags: [RemoteControl]
      operationId: revokeDeviceLink
      summary: 撤销设备级连接授权
      description: |
        此接口只接受非 bearer 的 grantId，不接受也不回传 deviceConnectionGrant。
        撤销会写入 Relay 共享拒绝标记，使该 Grant 无法再建立 Carrier；
        已建立的 Link 仍由设备访问/控制器身份的撤权版本栅栏统一处理。
      security:
        - sessionCookie: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RemoteControllerID"
        - name: grantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Grant 已撤销；响应禁止缓存
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
