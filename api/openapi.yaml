            $ref: "#/components/schemas/DeviceRemoteChange"
    DeviceRemoteChange:
      type: object
      additionalProperties: false
      required: [sequence, kind, operation, resourceId, revision, occurredAt]
      description: |
        项目 upsert 必须携带 displayName、capabilities 和 state；任务 upsert 必须携带
        taskType、title 和 status。tombstone 只需公共字段。metadata 只允许空对象或 null，
        云端不得接收本地路径、提示词、凭据或输出正文。
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum: [project, task]
        operation:
          type: string
          enum: [upsert, tombstone]
        resourceId:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
          minimum: 0
        occurredAt:
          type: string
          format: date-time
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        capabilities:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            maxLength: 80
            pattern: "^[a-z][a-z0-9_.:-]{0,79}$"
        state:
          type: string
          enum: [available, unavailable, removed]
        taskType:
          type: string
          enum: [codex, cursor, hermes, jcode, opencode, claude, kimi, pi, script, workflow, workspace.inspect, markdown.render, ai.summarize, remote]
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: 由 Agent 按任务类型生成的非敏感通用显示名，不是用户输入的任务标题。
        projectId:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/RemoteTaskStatus"
        resultCode:
          type: [string, "null"]
          maxLength: 80
          pattern: "^[a-z][a-z0-9_.:-]{0,79}$"
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        metadata:
          type: [object, "null"]
          additionalProperties: false
          maxProperties: 0
