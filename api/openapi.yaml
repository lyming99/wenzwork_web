        loginEvents:
          type: integer
          format: int64
          minimum: 0
        uniqueLoginIps:
          type: integer
          format: int64
          minimum: 0
        downloadedVisitorIps:
          type: integer
          format: int64
          minimum: 0
          description: 所选范围内至少有一个访问自然日同时发生下载的独立访问 IP 数。
        registeredVisitorIps:
          type: integer
          format: int64
          minimum: 0
          description: 所选范围内至少有一个访问自然日同时完成注册的独立访问 IP 数。
        visitorDownloadRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: downloadedVisitorIps / uniqueIps；没有访问 IP 时为 0。
        visitorRegistrationRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: registeredVisitorIps / uniqueIps；没有访问 IP 时为 0。
