          description: 仅创建或轮换及其相同幂等重放返回。凭证表只保存摘要；为恢复丢失响应，服务端另以绑定用户、操作、资源、请求摘要和幂等键的 AEAD 密文保存原响应。
        keyPrefix:
          type: string
          minLength: 8
          maxLength: 20
        scopes:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DeviceConnectionScope"
        boundDeviceId:
          type: [string, "null"]
          format: uuid
        status:
          type: string
          enum: [active, revoked]
        expiresAt:
          type: [string, "null"]
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    DeviceAccessKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeviceAccessKey"
    CreateDeviceAccessKeyRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          deprecated: true
          description: 兼容旧客户端；服务端忽略调用方选择并始终授予完整 Device Agent 权限。
          items:
            $ref: "#/components/schemas/DeviceConnectionScope"
        boundDeviceId:
          type: string
          format: uuid
        expiresAt:
          type: [string, "null"]
          format: date-time
    BrowserController:
      type: object
      additionalProperties: false
      required: [id, identityAlgorithm, identityPublicKey, publicKeyThumbprint, keyVersion, grantVersion, scopes, status, lastUsedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        identityAlgorithm:
          type: string
          enum: [Ed25519]
        identityPublicKey:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]+$"
        publicKeyThumbprint:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]+$"
        keyVersion:
          type: integer
          format: int64
          minimum: 1
        grantVersion:
          type: integer
          format: int64
          minimum: 1
        scopes:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            enum: [remote.peer.query, remote.peer.ai.config, remote.peer.ai.chat, remote.peer.ai.tools, remote.peer.terminal, remote.peer.terminal.interactive, remote.peer.file.send, remote.peer.file.receive, remote.peer.task.control, remote.peer.events]
        status:
          type: string
          enum: [active, revoked]
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BrowserControllerResponse:
      type: object
      additionalProperties: false
      required: [controller]
      properties:
        controller:
          $ref: "#/components/schemas/BrowserController"
    RegisterBrowserControllerRequest:
      type: object
      additionalProperties: false
      required: [controllerId, identityAlgorithm, identityPublicKey, proof, scopes]
      properties:
        controllerId:
          type: string
          format: uuid
        identityAlgorithm:
          type: string
          enum: [Ed25519]
        identityPublicKey:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]+$"
        proof:
          type: string
          minLength: 86
          maxLength: 86
          pattern: "^[A-Za-z0-9_-]+$"
        scopes:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            enum: [remote.peer.query, remote.peer.ai.config, remote.peer.ai.chat, remote.peer.ai.tools, remote.peer.terminal, remote.peer.terminal.interactive, remote.peer.file.send, remote.peer.file.receive, remote.peer.task.control, remote.peer.events]
    RotateBrowserControllerKeyRequest:
      type: object
      additionalProperties: false
      required: [identityAlgorithm, identityPublicKey, proof]
      properties:
        identityAlgorithm:
          type: string
          enum: [Ed25519]
        identityPublicKey:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]+$"
        proof:
          type: string
          minLength: 86
          maxLength: 86
          pattern: "^[A-Za-z0-9_-]+$"
    BootstrapRemoteDeviceRequest:
      type: object
      additionalProperties: false
      required: [deviceId, deviceName]
      properties:
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
    BootstrapRemoteDeviceResponse:
      type: object
      additionalProperties: false
      required: [user_id, session_id, access_token, expires_in, refresh_token, refresh_expires_in, scope]
      properties:
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        access_token:
          type: string
          minLength: 32
          writeOnly: true
        expires_in:
          type: integer
          format: int64
          minimum: 60
        refresh_token:
          type: string
          minLength: 32
          writeOnly: true
        refresh_expires_in:
          type: integer
          format: int64
          minimum: 3600
        scope:
          type: string
          minLength: 1
          maxLength: 512
    RegisterRemoteDeviceRequest:
      type: object
      additionalProperties: false
      required: [deviceName, platform, agentVersion, protocolMin, protocolMax, identityAlgorithm, identityPublicKey, proof]
      properties:
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
        platform:
          type: string
          enum: [windows, macos, linux]
        agentVersion:
          type: string
          minLength: 1
          maxLength: 64
        protocolMin:
          type: integer
          const: 2
        protocolMax:
          type: integer
          const: 2
        capabilities:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            maxLength: 80
        identityAlgorithm:
          type: string
          enum: [ed25519]
        identityPublicKey:
          type: string
          minLength: 43
          maxLength: 44
          pattern: "^[A-Za-z0-9_-]+$"
        proof:
          type: string
          maxLength: 512
          pattern: "^[A-Za-z0-9_-]+$"
    RegisterRemoteDeviceResponse:
      type: object
      additionalProperties: false
      required: [device, publicKeyThumbprint, approvalRequired]
      properties:
        device:
          $ref: "#/components/schemas/RemoteDevice"
        publicKeyThumbprint:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        approvalRequired:
          type: boolean
    RelayEndpoint:
      type: object
      additionalProperties: false
      description: 桌面设备连接中继服务时使用的公网接入地址。
      required: [cellId, endpointRevision, url]
      properties:
        cellId:
          type: string
          maxLength: 128
          description: 中继组编号；字段名保持 `cellId`。
        endpointRevision:
          type: integer
          format: int64
          minimum: 1
          description: 公网接入地址修订序号。
        url:
          type: string
          format: uri
          pattern: "^wss://"
          description: 使用 WSS 的公网接入地址。
    RelayRetryPolicy:
      type: object
      additionalProperties: false
      description: 中继连接失败后的退避重试策略。
      required: [initialDelayMs, maxDelayMs]
      properties:
        initialDelayMs:
          type: integer
          minimum: 100
          maximum: 60000
        maxDelayMs:
          type: integer
          minimum: 1000
          maximum: 300000
    RelayAllocationRequest:
      type: object
      additionalProperties: false
      description: 桌面设备申请中继组归属和短期连接票据的请求。
      required: [remoteDeviceId, protocolMin, protocolMax, connectionEpoch]
      properties:
        remoteDeviceId:
          type: string
          format: uuid
          description: 发起连接的远程设备编号。
        protocolMin:
          type: integer
          const: 2
        protocolMax:
          type: integer
          const: 2
        connectionEpoch:
          type: integer
          format: int64
          minimum: 1
          description: 由设备单调递增的连接代次，用于拒绝过期连接。
        preferredRegion:
          type: string
          maxLength: 80
          description: 首选服务区域代码；调度器可根据容量忽略该偏好。
    RelayAllocationRefreshRequest:
      type: object
      additionalProperties: false
      description: 刷新用户中继归属和短期连接票据的请求。
      properties:
        reason:
          type: string
          description: 刷新原因的稳定机器标识。
          enum: [scheduled, goaway, endpoint_changed, connection_failed, cell_unavailable]
        lastEndpointRevision:
          type: integer
          format: int64
          minimum: 0
          description: 设备最后使用的公网接入地址修订序号。
    RelayAllocationResponse:
      type: object
      additionalProperties: false
      description: 当前中继归属、首选和备用公网接入地址以及短期连接票据。
      required: [assignmentId, assignmentVersion, scope, primary, fallbacks, connectionTicket, ticketExpiresAt, assignmentLeaseExpiresAt, refreshAfter, retryPolicy, deviceLinkGrantTrust]
      properties:
        assignmentId:
          type: string
          format: uuid
          description: 用户中继归属编号。
        assignmentVersion:
          type: integer
          format: int64
          minimum: 1
          description: 归属版本；迁移时单调递增。
        scope:
          type: string
          enum: [user, device, device_group]
        primary:
          $ref: "#/components/schemas/RelayEndpoint"
        fallbacks:
          type: array
          maxItems: 4
          description: 按优先级排列的备用公网接入地址。
          items:
            $ref: "#/components/schemas/RelayEndpoint"
        connectionTicket:
          type: string
          minLength: 32
          maxLength: 16384
          description: 仅放入首个二进制 CARRIER_HELLO 的 deviceConnectionTicket 字段；不得放入 URL、子协议、日志或持久化状态。
        ticketExpiresAt:
          type: string
          format: date-time
        assignmentLeaseExpiresAt:
          type: string
          format: date-time
          description: 当前中继归属租约的过期时间。
        refreshAfter:
          type: string
          format: date-time
        retryPolicy:
          $ref: "#/components/schemas/RelayRetryPolicy"
        deviceLinkGrantTrust:
          $ref: "#/components/schemas/DeviceLinkGrantTrustBundle"
    DeviceLinkGrantVerificationKey:
      type: object
      additionalProperties: false
      required: [keyId, algorithm, publicKey]
      properties:
        keyId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9._:-]+$"
        algorithm:
          type: string
          enum: [Ed25519]
        publicKey:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
    DeviceLinkGrantTrustBundle:
      type: object
      additionalProperties: false
      description: 由已认证 HTTPS Control Plane 下发给 Device Agent 的 remote/v2 DeviceConnectionGrant 验签信任束；只用于验证 LINK_INIT 中的 PoP 授权凭据。
      required: [issuer, keys]
      properties:
        issuer:
          type: string
          minLength: 1
          maxLength: 128
        keys:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DeviceLinkGrantVerificationKey"
    CreateDeviceLinkRequest:
      type: object
      additionalProperties: false
      required: [targetDeviceId, clientIdentityKeyVersion]
      properties:
        targetDeviceId:
          type: string
          format: uuid
        clientIdentityKeyVersion:
          type: integer
          format: int64
          minimum: 1
          description: 必须等于当前 Controller Ed25519 公钥版本，防止已轮换身份重放旧授权请求。
        requestedMaximumLifetimeSeconds:
          type: integer
          minimum: 5
          maximum: 900
          deprecated: true
          description: 兼容旧 Client 的可选短期覆盖值；省略时签发无需周期续签的长期 PoP 口令。
    DeviceLinkResponse:
      type: object
      additionalProperties: false
      required: [deviceLink]
      properties:
        deviceLink:
          $ref: "#/components/schemas/DeviceLink"
    DeviceLink:
      type: object
      additionalProperties: false
      required: [grantId, deviceConnectionGrant, expiresAt, maximumLifetimeSeconds, relayUrl, relayNodeId, relayCellId, targetConnectionEpoch, deviceIdentityAlgorithm, deviceIdentityPublicKey, deviceKeyThumbprint, deviceIdentityKeyVersion]
      properties:
        grantId:
          type: string
          format: uuid
          description: 非 bearer 的撤销句柄；与 deviceConnectionGrant 不同，不能用于连接 Relay。
        deviceConnectionGrant:
          type: string
          minLength: 32
          maxLength: 8192
          writeOnly: true
          description: 可复用、PoP 绑定的长期口令；仅写入二进制 CARRIER_HELLO/LINK_INIT，必须配合 Controller 私钥证明。
        expiresAt:
          type: string
          format: date-time
          description: 长期口令固定返回 9999-12-31T23:59:59Z 兼容哨兵；不是周期续签期限。
        maximumLifetimeSeconds:
          type: integer
          minimum: 0
          maximum: 900
          description: 0 表示长期口令；5～900 仅用于兼容显式请求的短期 Grant。
        relayUrl:
          type: string
          format: uri
          pattern: "^wss?://.*/v2/connect$"
        relayNodeId:
          type: string
          format: uuid
        relayCellId:
          type: string
          format: uuid
        targetConnectionEpoch:
          type: integer
          format: int64
          minimum: 1
        deviceIdentityAlgorithm:
          type: string
          const: Ed25519
        deviceIdentityPublicKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        deviceKeyThumbprint:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        deviceIdentityKeyVersion:
          type: integer
          format: int64
          minimum: 1
    RotateRemoteDeviceKeyRequest:
      type: object
      additionalProperties: false
      required: [expectedKeyVersion, newIdentityPublicKey, oldProof, newProof]
      properties:
        expectedKeyVersion:
          type: integer
          format: int64
          minimum: 1
        newIdentityPublicKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        oldProof:
          type: string
          maxLength: 512
          pattern: "^[A-Za-z0-9_-]+$"
        newProof:
          type: string
          maxLength: 512
          pattern: "^[A-Za-z0-9_-]+$"
    RotateRemoteDeviceKeyResponse:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - identityPublicKey
        - publicKeyThumbprint
        - keyVersion
        - grantVersion
        - rotated
      properties:
        deviceId:
          type: string
          format: uuid
        identityPublicKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        publicKeyThumbprint:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        keyVersion:
          type: integer
          format: int64
          minimum: 1
        grantVersion:
          type: integer
          format: int64
          minimum: 1
        rotated:
          type: boolean
    RelayTopologyEndpoint:
      type: object
      additionalProperties: false
      description: 中继组当前生效的公网接入地址。
      required: [id, revision, endpointType, publicEndpoint, status, validatedAt, activatedAt]
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
          minimum: 1
          description: 公网接入地址修订序号。
        endpointType:
          type: string
          enum: [domain, ip]
        publicEndpoint:
          type: string
          format: uri
          pattern: "^wss://[^?#]+/v2/connect$"
          description: 桌面设备使用的 WSS 公网接入地址。
        status:
          type: string
          enum: [active]
        validatedAt:
          type: [string, "null"]
          format: date-time
        activatedAt:
          type: [string, "null"]
          format: date-time
    RelayTopologyCell:
      type: object
      additionalProperties: false
      description: 中继组，是调度、容量、接入地址和排空的最小单元。
      required: [id, code, name, failureDomain, status, weight, connectionSoftLimit, connectionHardLimit, protocolMin, protocolMax, activeEndpoint, installationCount, healthyInstances]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 80
          description: 中继组稳定代码，不因中文展示名变化。
        name:
          type: string
          maxLength: 120
          description: 中继组中文展示名。
        failureDomain:
          type: string
          maxLength: 120
        status:
          type: string
          enum: [draft, active, draining, disabled]
        weight:
          type: number
          exclusiveMinimum: 0
          maximum: 100
        connectionSoftLimit:
          type: integer
          format: int64
          minimum: 1
        connectionHardLimit:
          type: integer
          format: int64
          minimum: 1
        protocolMin:
          type: integer
          const: 2
        protocolMax:
          type: integer
          const: 2
        activeEndpoint:
          description: 当前生效的公网接入地址；未激活时为空。
          oneOf:
            - $ref: "#/components/schemas/RelayTopologyEndpoint"
            - type: "null"
        installationCount:
          type: integer
          format: int64
          minimum: 0
          description: 绑定到该中继组的节点安装记录数量。
        healthyInstances:
          type: integer
          format: int64
          minimum: 0
          description: 当前健康运行实例数量。
    RelayTopologyPool:
      type: object
      additionalProperties: false
      description: 资源池，用于隔离调度和容量策略。
      required: [id, code, name, status, cells]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 80
          description: 资源池稳定代码。
        name:
          type: string
          maxLength: 120
          description: 资源池中文展示名。
        status:
          type: string
          enum: [active, disabled]
        cells:
          type: array
          items:
            $ref: "#/components/schemas/RelayTopologyCell"
    RelayTopologyRegion:
      type: object
      additionalProperties: false
      description: 服务区域，用于表达地域和数据驻留边界。
      required: [id, code, name, dataResidency, status, pools]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 80
          description: 服务区域稳定代码。
        name:
          type: string
          maxLength: 120
          description: 服务区域中文展示名。
        dataResidency:
          type: string
          maxLength: 120
        status:
          type: string
          enum: [active, disabled]
        pools:
          type: array
          items:
            $ref: "#/components/schemas/RelayTopologyPool"
    RelayTopologyList:
      type: object
      additionalProperties: false
      description: 按服务区域、资源池、中继组分层的中继服务拓扑。
      required: [items, defaultCellId]
      properties:
        defaultCellId:
          type: string
          format: uuid
          description: 旧版拓扑客户端使用的内部兼容字段；Relay 主机管理无需读取或提交它。
        items:
          type: array
          items:
            $ref: "#/components/schemas/RelayTopologyRegion"
    RelayDeploymentChecklist:
      type: object
      additionalProperties: false
      required: [lb, dns, port, tls]
      properties:
        lb:
          type: boolean
          description: 宿主机已加入外部负载均衡后端。
        dns:
          type: boolean
          description: 中继组域名或多记录 DNS 已配置并验证。
        port:
          type: boolean
          description: WSS、管理中心和 Redis 所需端口已开放。
        tls:
          type: boolean
          description: 公网接入地址和节点 mTLS 信任已验证。
    RelayInstallationStatus:
      type: string
      description: 节点安装记录状态；展示层使用统一中文状态映射。
      enum: [draft, pending_enrollment, enrolled, pending_activation, active, draining, disabled, revoked, expired, deleted]
    RelayNodeInstance:
      type: object
      additionalProperties: false
      description: 中继程序的一次运行实例；程序重启会创建新的运行实例。
      required: [id, installationId, cellId, status, version, protocolVersion, addresses, capabilities, activeConnections, activeFileTransfers, memoryBytes, ingressMbps, egressMbps, writeLoopLagMs, startedAt, lastHeartbeatAt, leaseExpiresAt, stoppedAt]
      properties:
        id:
          type: string
          format: uuid
          description: 运行实例编号。
        installationId:
          type: string
          format: uuid
          description: 所属节点安装记录编号。
        cellId:
          type: string
          format: uuid
          description: 所属中继组编号；字段名保持 `cellId`。
        status:
          type: string
          description: 运行实例状态；展示层使用统一中文状态映射。
          enum: [starting, ready, draining, stopped, failed, offline, forced_offline]
        version:
          type: string
          maxLength: 64
        protocolVersion:
          type: integer
          enum: [2]
        addresses:
          type: array
          description: Relay 自报的可访问地址；Access Key 模式下包含管理端下发的客户端 WS/WSS 连接。
          maxItems: 16
          items:
            type: string
            maxLength: 255
        capabilities:
          type: object
          additionalProperties: true
        activeConnections:
          type: integer
          format: int64
          minimum: 0
        activeFileTransfers:
          type: integer
          format: int64
          minimum: 0
        memoryBytes:
          type: integer
          format: int64
          minimum: 0
        ingressMbps:
          type: number
          minimum: 0
        egressMbps:
          type: number
          minimum: 0
        writeLoopLagMs:
          type: number
          minimum: 0
        startedAt:
          type: string
          format: date-time
        lastHeartbeatAt:
          type: string
          format: date-time
          description: 最近一次收到心跳的时间。
        leaseExpiresAt:
          type: string
          format: date-time
        stoppedAt:
          type: [string, "null"]
          format: date-time
    RelayInstallation:
      type: object
      additionalProperties: false
      description: 中继节点在宿主机上的稳定安装记录；程序重启不会改变该记录编号。
      required: [id, cellId, cellCode, releaseId, displayName, region, group, failureDomain, operationsNote, publicEndpoint, listenerPort, platform, architecture, status, identityThumbprint, deploymentChecklist, firstEnrolledAt, activatedAt, revokedAt, version, currentInstance, instances, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: 节点安装记录编号。
        cellId:
          type: string
          format: uuid
          description: 绑定的中继组编号；字段名保持 `cellId`。
        cellCode:
          type: string
          maxLength: 80
          description: 绑定的中继组稳定代码。
        releaseId:
          type: [string, "null"]
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 120
          description: 节点安装记录中文展示名。
        region:
          type: string
          maxLength: 80
          description: Relay 所在地区的自由文本标签；为空表示未设置。
        group:
          type: string
          maxLength: 80
          description: Relay 分组的自由文本标签；为空表示未分组。
        failureDomain:
          type: string
          maxLength: 120
        operationsNote:
          type: string
          maxLength: 2000
        publicEndpoint:
          type: string
          maxLength: 255
          pattern: "^$|^wss?://[^?#]+/v2/connect$"
          description: 客户端使用的 WS 或 WSS 地址；WSS 由部署者的反向代理终止 TLS，空值表示尚未配置。
        listenerPort:
          type: integer
          minimum: 1
          maximum: 65535
          description: Relay 本地明文 WebSocket 监听端口；WSS 反向代理应转发到此端口。
        platform:
          type: string
          enum: [linux, windows, darwin]
          description: Relay 原生服务平台；分别使用 systemd、Windows Service 或 launchd。
        architecture:
          type: string
          enum: [amd64, arm64]
        status:
          $ref: "#/components/schemas/RelayInstallationStatus"
        identityThumbprint:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        deploymentChecklist:
          $ref: "#/components/schemas/RelayDeploymentChecklist"
        firstEnrolledAt:
          type: [string, "null"]
          format: date-time
        activatedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
        currentInstance:
          description: 当前运行实例；节点程序未运行时为空。
          oneOf:
            - $ref: "#/components/schemas/RelayNodeInstance"
            - type: "null"
        instances:
          type: array
          description: 当前和历史运行实例，按时间倒序排列。
          items:
            $ref: "#/components/schemas/RelayNodeInstance"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RelayInstallationList:
      type: object
      additionalProperties: false
      description: 节点安装记录列表。
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RelayInstallation"
    CreateRelayInstallationRequest:
      type: object
      additionalProperties: false
      description: 创建稳定节点安装记录的请求。
      required: [displayName, region, group, failureDomain, operationsNote, publicEndpoint, listenerPort, platform, architecture]
      properties:
        releaseId:
          type: [string, "null"]
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 120
          description: 节点安装记录中文展示名。
        region:
          type: string
          maxLength: 80
        group:
          type: string
          maxLength: 80
        failureDomain:
          type: string
          maxLength: 120
        operationsNote:
          type: string
          maxLength: 2000
        publicEndpoint:
          type: string
          maxLength: 255
          pattern: "^$|^wss?://[^?#]+/v2/connect$"
          description: 客户端使用的完整 WS/WSS 地址；WSS 证书和私钥由反向代理管理。
        listenerPort:
          type: integer
          minimum: 1
          maximum: 65535
          description: Relay 本地明文 WebSocket 监听端口。
        platform:
          type: string
          enum: [linux, windows, darwin]
          description: Relay 原生服务平台；必须与所选 Release 完全一致。
        architecture:
          type: string
          enum: [amd64, arm64]
    UpdateRelayInstallationRequest:
      type: object
      additionalProperties: false
      description: 更新尚未激活节点安装记录的请求。
      required: [displayName, region, group, failureDomain, operationsNote, publicEndpoint, listenerPort, deploymentChecklist, expectedVersion]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        region:
          type: string
          maxLength: 80
        group:
          type: string
          maxLength: 80
        failureDomain:
          type: string
          maxLength: 120
        operationsNote:
          type: string
          maxLength: 2000
        publicEndpoint:
          type: string
          maxLength: 255
          pattern: "^$|^wss?://[^?#]+/v2/connect$"
          description: 客户端使用的完整 WS/WSS 地址；WSS 证书和私钥由反向代理管理。
        listenerPort:
          type: integer
          minimum: 1
          maximum: 65535
          description: Relay 本地明文 WebSocket 监听端口。
        deploymentChecklist:
          $ref: "#/components/schemas/RelayDeploymentChecklist"
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
    RelayAccessKey:
      type: object
      additionalProperties: false
      description: 管理端生成、长期有效且可随时吊销的中继主机 Access Key。
      required: [id, installationId, key, keyPrefix, createdAt]
      properties:
        id:
          type: string
          format: uuid
        installationId:
          type: string
          format: uuid
        key:
          type: string
          writeOnly: true
          pattern: "^relay_[A-Za-z0-9_-]{43}$"
          description: Access Key 明文；仅在创建响应中返回一次。
        keyPrefix:
          type: string
          minLength: 6
          maxLength: 20
          description: 可安全展示、用于识别 Key 的前缀。
        createdAt:
          type: string
          format: date-time
    RelayAgentBinding:
      type: object
      additionalProperties: false
      required: [installationId, cellId, status, configuration]
      properties:
        installationId:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RelayInstallationStatus"
        configuration:
          $ref: "#/components/schemas/RelayAgentRuntimeConfiguration"
    RelayAgentRuntimeConfiguration:
      type: object
      additionalProperties: false
      description: Relay 使用 Access Key 启动时由管理端统一下发的运行配置。
      required: [protocolVersion, publicEndpoint, browserOriginPatterns, listenAddress, healthAddress, redisUrl, ticketIssuer, ticketPublicKeys, deviceLinkGrantPublicKeys, connectionHardLimit, handshakeConcurrency]
      properties:
        protocolVersion:
          type: integer
          enum: [2]
        publicEndpoint:
          type: string
          maxLength: 255
          pattern: "^$|^wss?://[^?#]+/v2/connect$"
        browserOriginPatterns:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          description: 允许管理页面跨来源直连该 Relay 的 HTTP 或 HTTPS 来源列表。
          items:
            type: string
            maxLength: 255
            pattern: "^https?://[^/?#]+/?$"
        listenAddress:
          type: string
          minLength: 1
          maxLength: 255
        healthAddress:
          type: string
          minLength: 1
          maxLength: 255
        redisUrl:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
        ticketIssuer:
          type: string
          minLength: 1
          maxLength: 120
        ticketPublicKeys:
          type: object
          minProperties: 1
          maxProperties: 8
          additionalProperties:
            type: string
            pattern: "^[A-Za-z0-9_-]{43}$"
        deviceLinkGrantPublicKeys:
          type: object
          minProperties: 1
          maxProperties: 8
          additionalProperties:
            type: string
            pattern: "^[A-Za-z0-9_-]{43}$"
        connectionHardLimit:
          type: integer
          minimum: 1
          maximum: 10000000
        handshakeConcurrency:
          type: integer
          minimum: 1
          maximum: 100000
    RelayAgentRegisterRequest:
      type: object
      additionalProperties: false
      required: [instanceId, version, protocolVersion, addresses, capabilities, startedAt]
      properties:
        instanceId:
          type: string
          format: uuid
        version:
          type: string
          minLength: 1
          maxLength: 64
        protocolVersion:
          type: integer
          enum: [2]
        addresses:
          type: array
          description: Relay 注册时自报的地址；Access Key 模式下为管理端下发的客户端 WS/WSS 地址。
          maxItems: 16
          items:
            type: string
            maxLength: 255
        capabilities:
          type: object
          additionalProperties: true
        startedAt:
          type: string
          format: date-time
    RelayAgentHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [activeConnections, activeFileTransfers, memoryBytes, ingressMbps, egressMbps, writeLoopLagMs, addresses, capabilities]
      properties:
        instanceId:
          type: string
          format: uuid
          description: 可选冗余校验；提供时必须与路径一致。
        activeConnections:
          type: integer
          format: int64
          minimum: 0
        activeFileTransfers:
          type: integer
          format: int64
          minimum: 0
        memoryBytes:
          type: integer
          format: int64
          minimum: 0
        ingressMbps:
          type: number
          minimum: 0
        egressMbps:
          type: number
          minimum: 0
        writeLoopLagMs:
          type: number
          minimum: 0
        addresses:
          type: array
          description: Relay 心跳时持续自报的地址；Access Key 模式下为管理端下发的客户端 WS/WSS 地址。
          maxItems: 16
          items:
            type: string
            maxLength: 255
        capabilities:
          type: object
          additionalProperties: true
    RelayAgentHeartbeatResponse:
      type: object
      additionalProperties: false
      required: [leaseExpiresAt, drain, revoked, routingReady]
      properties:
        leaseExpiresAt:
          type: string
          format: date-time
        drain:
          type: boolean
        revoked:
          type: boolean
        routingReady:
          type: boolean
    RelayEnrollmentToken:
      type: object
      additionalProperties: false
      description: 只显示一次、短期有效的一次性注册令牌。
      required: [id, installationId, token, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        installationId:
          type: string
          format: uuid
          description: 令牌绑定的节点安装记录编号。
        token:
          type: string
          writeOnly: true
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
          description: 一次性注册令牌明文；仅在创建响应中返回。
        expiresAt:
          type: string
          format: date-time
    CreateRelayInstallSessionRequest:
      type: object
      additionalProperties: false
      required: [releaseId, mode]
      properties:
        releaseId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [download, script, manual]
    RelayInstallSession:
      type: object
      additionalProperties: false
      description: 节点安装流程的短期会话。
      required: [id, installationId, releaseId, mode, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        installationId:
          type: string
          format: uuid
          description: 节点安装记录编号。
        releaseId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [download, script, manual]
        status:
          type: string
          description: 安装会话状态；展示层使用统一中文状态映射。
          enum: [waiting, enrolled, heartbeat_received, expired, cancelled]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    RelayInstallSessionResponse:
      type: object
      additionalProperties: false
      required: [session, installCommand]
      properties:
        session:
          $ref: "#/components/schemas/RelayInstallSession"
        installCommand:
          type: string
          description: 不含一次性注册令牌；脚本仅从隐藏输入、stdin 或 0600 文件读取令牌。
          maxLength: 4096
    ActivateRelayInstallationRequest:
      type: object
      additionalProperties: false
      required: [expectedThumbprint, deploymentChecklist, confirmation]
      properties:
        expectedThumbprint:
          type: string
          pattern: "^$|^[0-9a-f]{64}$"
          description: 旧版 mTLS 主机需提供指纹；Access Key 主机恢复接入时为空。
        deploymentChecklist:
          $ref: "#/components/schemas/RelayDeploymentChecklist"
        confirmation:
          type: string
          const: activate_relay_installation
    RelayRevocationRequest:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          const: revoke_relay_installation
    RelayBootstrapInstallation:
      type: object
      additionalProperties: false
      description: 中继节点注册前可读取的非敏感安装绑定信息。
      required: [installationId, cellId, platform, architecture, releaseVersion, protocolMin, protocolMax]
      properties:
        installationId:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        platform:
          type: string
          enum: [linux, windows, darwin]
          description: 安装记录绑定的平台，节点注册时必须与运行主机一致。
        architecture:
          type: string
          enum: [amd64, arm64]
        releaseVersion:
          type: string
          maxLength: 64
        protocolMin:
          type: integer
          const: 2
        protocolMax:
          type: integer
          const: 2
    RelayEnrollmentRequest:
      type: object
      additionalProperties: false
      description: 中继节点使用一次性注册令牌和持钥证明完成注册的请求。
      required: [installationId, cellId, publicKey, nonce, timestamp, signature, version, protocolVersion, addresses, capabilities]
      properties:
        installationId:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        publicKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        nonce:
          type: string
          minLength: 22
          maxLength: 86
          pattern: "^[A-Za-z0-9_-]+$"
        timestamp:
          type: string
          format: date-time
        signature:
          type: string
          pattern: "^[A-Za-z0-9_-]{86}$"
        version:
          type: string
          minLength: 1
          maxLength: 64
        protocolVersion:
          type: integer
          enum: [2]
        addresses:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 255
        capabilities:
          type: object
          additionalProperties: true
    RelayEnrollmentResponse:
      type: object
      additionalProperties: false
      description: 注册成功后签发给中继节点的短期 mTLS 身份。
      required: [installationId, cellId, identityThumbprint, certificatePem, certificateAuthorityPem, certificateExpiresAt, directoryUrl]
      properties:
        installationId:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        identityThumbprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
        certificatePem:
          type: string
          writeOnly: true
          maxLength: 65536
        certificateAuthorityPem:
          type: string
          maxLength: 65536
        certificateExpiresAt:
          type: string
          format: date-time
        directoryUrl:
          type: string
          format: uri
          pattern: "^https://"
    RelayServerArtifact:
      type: object
      additionalProperties: false
      description: 已签名中继程序版本中的安装附件。
      required: [id, fileName, fileSizeBytes, sha256, signature, objectKey]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        fileSizeBytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        signature:
          type: string
          minLength: 16
          maxLength: 4096
          pattern: "^\\S+$"
        objectKey:
          type: string
          minLength: 1
          maxLength: 1024
          description: 制品存储中的规范相对对象键；禁止绝对路径与父目录穿越。
    SaveRelayServerArtifactRequest:
      type: object
      additionalProperties: false
      required: [fileName, fileSizeBytes, sha256, signature, objectKey]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        fileSizeBytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        signature:
          type: string
          minLength: 16
          maxLength: 4096
          pattern: "^\\S+$"
        objectKey:
          type: string
          minLength: 1
          maxLength: 1024
    RelayServerRelease:
      type: object
      additionalProperties: false
      description: 可部署到中继节点宿主机的目标专用已签名版本；支持 linux、windows、darwin 与 amd64、arm64 的六种组合。
      required: [id, version, platform, architecture, protocolMin, protocolMax, buildCommit, buildTime, signingKeyId, manifestSha256, manifestSignature, status, artifacts]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$"
        platform:
          type: string
          enum: [linux, windows, darwin]
          description: 独立构建和签名的 Release 目标平台。
        architecture:
          type: string
          enum: [amd64, arm64]
        protocolMin:
          type: integer
          const: 2
        protocolMax:
          type: integer
          const: 2
        buildCommit:
          type: string
          minLength: 40
          maxLength: 64
          pattern: "^[0-9a-f]{40,64}$"
        buildTime:
          type: string
          format: date-time
        signingKeyId:
          type: string
          minLength: 1
          maxLength: 120
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,119}$"
        manifestSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        manifestSignature:
          type: string
          minLength: 16
          maxLength: 4096
          pattern: "^\\S+$"
        status:
          type: string
          enum: [draft, published, retired, revoked]
        artifacts:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          description: 文件名必须唯一，并且必须恰好包含一个 .tar.gz 安装包。
          contains:
            type: object
            required: [fileName]
            properties:
              fileName:
                type: string
                pattern: "\\.[Tt][Aa][Rr]\\.[Gg][Zz]$"
          minContains: 1
          maxContains: 1
          items:
            $ref: "#/components/schemas/RelayServerArtifact"
    SaveRelayServerReleaseRequest:
      type: object
      additionalProperties: false
      description: 登记一个目标专用 Release；同一安装包不得跨平台或跨架构复用。
      required: [version, platform, architecture, protocolMin, protocolMax, buildCommit, buildTime, signingKeyId, manifestSha256, manifestSignature, artifacts]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$"
        platform:
          type: string
          enum: [linux, windows, darwin]
          description: 独立构建和签名的 Release 目标平台。
        architecture:
          type: string
          enum: [amd64, arm64]
        protocolMin:
          type: integer
          const: 2
        protocolMax:
          type: integer
          const: 2
        buildCommit:
          type: string
          minLength: 40
          maxLength: 64
          pattern: "^[0-9a-f]{40,64}$"
        buildTime:
          type: string
          format: date-time
        signingKeyId:
          type: string
          minLength: 1
          maxLength: 120
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,119}$"
        manifestSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        manifestSignature:
          type: string
          minLength: 16
          maxLength: 4096
          pattern: "^\\S+$"
        artifacts:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          description: fileName 必须唯一，并且必须恰好包含一个 .tar.gz 安装包。
          contains:
            type: object
            required: [fileName]
            properties:
              fileName:
                type: string
                pattern: "\\.[Tt][Aa][Rr]\\.[Gg][Zz]$"
          minContains: 1
          maxContains: 1
          items:
            $ref: "#/components/schemas/SaveRelayServerArtifactRequest"
    RelayServerReleaseList:
      type: object
      additionalProperties: false
      description: 管理端登记的中继程序版本列表，包含全部生命周期状态。
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RelayServerRelease"
    RelayCellStatus:
      type: string
