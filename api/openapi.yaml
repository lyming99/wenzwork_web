      schema:
        type: string
        format: uuid
    RelayNodeID:
      name: nodeId
      in: path
      required: true
      description: 中继节点编号；管理接口中的该编号对应运行实例。
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    RelayEndpointID:
      name: endpointId
      in: path
      required: true
      description: 公网接入地址记录编号。
      schema:
        type: string
        format: uuid
    RelayOperationID:
      name: operationId
      in: path
      required: true
