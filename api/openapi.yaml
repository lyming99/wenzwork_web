      properties:
        accessKey:
          type: string
          minLength: 51
          maxLength: 51
          pattern: "^release_[A-Za-z0-9_-]{43}$"
          writeOnly: true
          description: 新的 Release Access Key；只保存 SHA-256 摘要，不能通过查询接口取回。
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
    SaveAdminReleaseAsset:
      type: object
      additionalProperties: false
      required: [platform, architecture, fileName, fileSizeBytes, sha256, signatureStatus, source, objectKey, downloadUrl]
      properties:
        platform:
          type: string
          enum: [web, windows, macos, linux, android, ios]
