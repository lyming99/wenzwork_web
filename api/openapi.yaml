      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
            enum: [web, desktop, mobile]
        - name: version
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum: [web, windows, macos, linux, android, ios]
        - name: architecture
          in: query
          required: true
          schema:
            type: string
            enum: [x64, arm64, universal]
        - name: fileName
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: fileSizeBytes
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 5368709120
        - name: sha256
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{64}$"
        - name: signatureStatus
          in: query
          schema:
            type: string
            enum: [unknown, unsigned, valid]
            default: unknown
