components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-wenzwork_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    releaseAccessKey:
      type: http
      scheme: bearer
      bearerFormat: ReleaseAccessKey
      description: 使用服务端生成的 `release_<secret>`，仅供本机构建与发布脚本调用。
    deviceAccessKey:
      type: apiKey
