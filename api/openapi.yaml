    AsyncOperationStatus:
      type: string
      description: 异步操作状态；展示层使用统一中文状态映射。
      enum: [queued, running, succeeded, failed, cancelled]
    AsyncOperation:
      type: object
      additionalProperties: false
      description: 中继服务异步操作及其总体进度。
      required:
        - id
        - type
        - status
        - targetType
        - targetId
        - progressCompleted
        - progressTotal
        - progressPercent
        - resultCode
        - errorMessage
        - items
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          pattern: "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)+$"
          description: 稳定操作类型标识；展示层转换为中文操作名。
        status:
          $ref: "#/components/schemas/AsyncOperationStatus"
        targetType:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,79}$"
        targetId:
          type: [string, "null"]
          format: uuid
        progressCompleted:
          type: integer
          minimum: 0
          description: 已完成的子项数量。
        progressTotal:
          type: integer
          minimum: 0
          description: 子项总数。
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
        resultCode:
          type: [string, "null"]
          maxLength: 80
          pattern: "^[a-z][a-z0-9_.:-]{0,79}$"
          description: 稳定结果码；为空表示尚无最终结果。
        errorMessage:
          type: [string, "null"]
          maxLength: 500
          description: 面向人员的中文失败原因；为空表示没有失败。
        items:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/RelayOperationItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AsyncOperationResponse:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation:
          $ref: "#/components/schemas/AsyncOperation"
    RelayOperationItem:
      type: object
      additionalProperties: false
      description: 中继异步操作中的单个处理项。
      required: [id, targetType, targetId, status, attempts, errorCode, errorMessage, startedAt, finishedAt]
      properties:
        id:
          type: string
          format: uuid
        targetType:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,79}$"
        targetId:
          type: [string, "null"]
          format: uuid
        status:
          type: string
          description: 子项处理状态；展示层使用统一中文状态映射。
          enum: [pending, running, succeeded, failed, skipped]
        attempts:
          type: integer
          minimum: 0
        errorCode:
          type: [string, "null"]
          maxLength: 80
          description: 供程序判断的稳定英文错误码。
        errorMessage:
          type: [string, "null"]
          maxLength: 500
          description: 面向人员的中文失败原因。
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
    RemoteScope:
      type: string
      enum:
        - remote.connect
        - remote.project.read
        - remote.project.sync
