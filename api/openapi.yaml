      required:
        - id
        - cellId
        - revision
        - endpointType
        - publicEndpoint
        - status
        - validationResult
        - certificateNotAfter
        - validatedAt
        - activatedAt
        - drainUntil
        - supersededAt
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
          description: 所属中继组编号；字段名保持 `cellId`。
        revision:
          type: integer
          format: int64
          minimum: 1
          description: 激活时单调递增的修订序号。
        endpointType:
          type: string
          enum: [domain, ip]
        publicEndpoint:
          type: string
          format: uri
          pattern: "^wss://[^?#]+/v2/connect$"
          description: 桌面设备使用的 WSS 公网接入地址。
        status:
          type: string
          description: 公网接入地址状态；展示层使用统一中文状态映射。
          enum: [draft, validating, validated, active, draining, retired, failed]
        validationResult:
          type: [object, "null"]
        certificateNotAfter:
          type: [string, "null"]
          format: date-time
        validatedAt:
          type: [string, "null"]
          format: date-time
        activatedAt:
          type: [string, "null"]
          format: date-time
        drainUntil:
          type: [string, "null"]
          format: date-time
        supersededAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RelayManagedEndpointList:
      type: object
      additionalProperties: false
      description: 公网接入地址当前记录和历史记录列表。
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RelayManagedEndpoint"
    RelayEndpointActivationRequest:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [activate_relay_endpoint]
    RelayNodeDrainRequest:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [drain_relay_node]
    RelayCellDrainRequest:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [drain_relay_cell]
    RelayAssignment:
      type: object
      additionalProperties: false
      description: 用户到中继组的稳定归属及租约信息。
      required:
        - id
        - userId
        - cellId
        - cellCode
        - assignmentVersion
        - mode
        - status
        - fallbackCellIds
        - leaseExpiresAt
        - effectiveAt
        - supersededAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: 用户中继归属编号。
        userId:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
          description: 当前中继组编号；字段名保持 `cellId`。
        cellCode:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,62}$"
          description: 当前中继组稳定代码。
        assignmentVersion:
          type: integer
          format: int64
          minimum: 1
          description: 归属版本；迁移时单调递增。
        mode:
          type: string
          description: 自动调度或管理员指定模式；展示层使用中文模式名。
          enum: [auto, pinned]
        status:
          type: string
          description: 用户中继归属状态；展示层使用统一中文状态映射。
          enum: [pending, effective, historical, expired]
        fallbackCellIds:
          type: array
          maxItems: 8
          items:
            type: string
            format: uuid
        leaseExpiresAt:
          type: string
          format: date-time
        effectiveAt:
          type: [string, "null"]
          format: date-time
        supersededAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RelayAssignmentList:
      type: object
      additionalProperties: false
      description: 用户当前和历史中继归属列表。
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RelayAssignment"
    MigrateRelayUserRequest:
      type: object
      additionalProperties: false
      description: 迁移用户中继归属或恢复自动调度的请求。
      required: [mode, confirmation]
      properties:
        mode:
          type: string
          enum: [auto, pinned]
        targetCellId:
          type: [string, "null"]
          format: uuid
          description: 指定模式下的目标中继组编号；字段名保持 `targetCellId`。
        confirmation:
          type: string
          enum: [migrate_relay_user]
