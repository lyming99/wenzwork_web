openapi: 3.1.0
info:
  title: WenzWork Web API
  version: 0.1.0
  description: WenzWork 官网、账户、会员兑换码、帮助文档、反馈与管理后台 API 契约。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: 同域 API
tags:
  - name: Health
    description: 服务存活和依赖就绪状态。
  - name: PublicCatalog
    description: 公开价格、版本与安装包目录。
  - name: PublicHelp
    description: 已静态化的公开帮助文档。
  - name: Authentication
    description: 注册、邮箱验证、登录、退出与密码恢复。
  - name: AppAuthentication
    description: 桌面客户端登录窗口、设备授权轮询、令牌刷新与吊销。
  - name: Analytics
    description: 官网页面访问采集；不提供公开统计读取能力。
  - name: Account
    description: 当前账户资料、安全设置与登录会话。
  - name: Membership
    description: 当前用户的会员状态与兑换操作。
  - name: Promotions
    description: 公开内测活动名额查询与邮箱领取。
  - name: Feedback
    description: 当前用户的反馈提交与处理进度。
  - name: AdminMembership
    description: 受 RBAC 保护，并在显式启用管理员 MFA 门禁时要求二次验证的会员运营接口。
  - name: AdminUsers
    description: 受 RBAC 保护，并在显式启用管理员 MFA 门禁时要求二次验证的账户与会员权限管理接口。
  - name: AdminReleases
    description: 受 RBAC 保护，并在显式启用管理员 MFA 门禁时要求二次验证的软件版本、更新公告与文件列表接口。
  - name: ReleasePush
    description: 使用独立 Release Access Key 接收本机构建产物，并幂等合并到管理端版本目录。
  - name: AdminPricing
    description: 受 RBAC 保护，并在显式启用管理员 MFA 门禁时要求二次验证的价格套餐、版本快照与上下架接口。
  - name: AdminHelp
    description: 受 RBAC 保护，并在显式启用管理员 MFA 门禁时要求二次验证的帮助文档草稿、发布与归档接口。
  - name: AdminFeedback
    description: 受 RBAC 保护，并在显式启用管理员 MFA 门禁时要求二次验证的用户反馈处理接口。
  - name: AdminAnalytics
    description: 仅限具备审计权限的管理员；显式启用管理员 MFA 门禁时还需完成二次验证。
  - name: RemoteControl
    description: 浏览器查询远程设备、项目投影、任务和日志；写操作异步完成。
  - name: DeviceRemote
    description: 桌面代理注册设备、获取中继连接、点对点会话和文件传输票据，并摄取任务日志。
  - name: AdminRelay
    description: 受员工访问策略、RBAC 与审计保护；显式启用管理员 MFA 门禁时还需完成二次验证的中继服务管理接口。
  - name: RelayAgent
    description: 中继程序使用长期、可撤销 Access Key 建立管理连接并上报心跳。
security: []
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: 进程存活检查
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/Problem"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: 依赖就绪检查
      responses:
        "200":
          description: 服务可接收流量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/Problem"
  /pricing-plans:
    get:
      tags: [PublicCatalog]
      operationId: listPricingPlans
      summary: 获取已发布价格套餐
      responses:
        "200":
          description: 按展示顺序排列的已发布套餐
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingPlanList"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /help-documents:
    get:
      tags: [PublicHelp]
      operationId: listPublishedHelpDocuments
      summary: 获取已发布帮助文档索引
      responses:
        "200":
          description: 按后台展示顺序排列的静态发布快照
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpDocumentList"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /help-documents/{slug}:
    get:
      tags: [PublicHelp]
      operationId: getPublishedHelpDocument
      summary: 获取一篇已静态化帮助文档
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      responses:
        "200":
          description: 当前已发布的安全 HTML 快照
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicHelpDocumentResponse"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /releases:
    get:
      tags: [PublicCatalog]
      operationId: listReleases
      summary: 获取已发布版本历史
      parameters:
        - $ref: "#/components/parameters/ReleaseProjectQuery"
        - $ref: "#/components/parameters/ReleaseChannelQuery"
        - $ref: "#/components/parameters/ReleasePlatformQuery"
        - $ref: "#/components/parameters/ReleaseArchitectureQuery"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 已发布版本列表
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseList"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /releases/latest:
    get:
      tags: [PublicCatalog]
      operationId: getLatestRelease
      summary: 获取最新已发布版本
      parameters:
        - $ref: "#/components/parameters/ReleaseProjectQuery"
        - $ref: "#/components/parameters/ReleaseChannelQuery"
        - $ref: "#/components/parameters/ReleasePlatformQuery"
        - $ref: "#/components/parameters/ReleaseArchitectureQuery"
      responses:
        "200":
          description: 最新已发布版本
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /release-assets/{assetId}/download:
    get:
      tags: [PublicCatalog]
      operationId: downloadReleaseAsset
      summary: 下载已发布安装包
      description: 根据管理端设置，通过主机中转 S3、GitHub、镜像或本地推送文件，或跳转到 S3/CDN、GitHub 临时下载链接；镜像文件始终从受控链接写入主机缓存，本地推送文件直接读取持久发布目录，二者均不经过 S3。
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: 主机缓存模式返回安装包；请求 JSON 时返回可用下载目标
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadTarget"
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: S3 链接或 GitHub 链接模式跳转到外部下载地址
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerAccount
      summary: 注册账户并发送邮箱验证邮件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: 请求已接收；响应不会泄露邮箱是否已注册
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
  /auth/resend-verification:
    post:
      tags: [Authentication]
      operationId: resendEmailVerification
      summary: 重新发送邮箱验证邮件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: 请求已接收；响应不会泄露账户状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
  /auth/verify-email:
    post:
      tags: [Authentication]
      operationId: verifyAccountEmail
      summary: 使用一次性令牌验证邮箱
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: 邮箱验证成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginAccount
      summary: 使用邮箱和密码创建服务端会话
      description: 登录成功后通过 Cookie 建立浏览器会话；启用安全 Cookie 时从 HTTP 来源请求会返回 `secure_transport_required`，不会返回无法持久化会话的伪成功响应。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功；会话和 CSRF 令牌通过 Cookie 下发
          headers:
            Set-Cookie:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /analytics/page-view:
    post:
      tags: [Analytics]
      operationId: recordWebsitePageView
      summary: 记录一次官网页面访问
      description: IP 与 User-Agent 由服务端从请求读取；客户端路径中的查询参数不会被保存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageViewRequest"
      responses:
        "204":
          description: 访问已记录
        "400":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /oauth/device-authorization:
    post:
      tags: [AppAuthentication]
      operationId: createDeviceAuthorization
      summary: 为桌面客户端创建一个短期登录窗口
      description: device_code 只返回给客户端；浏览器只能接触 user_code 和 verification_uri_complete。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAuthorizationRequest"
      responses:
        "200":
          description: 登录窗口已创建
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorizationResponse"
        "400":
          $ref: "#/components/responses/OAuthError"
        "415":
          $ref: "#/components/responses/OAuthError"
        "429":
          $ref: "#/components/responses/OAuthError"
        "503":
          $ref: "#/components/responses/OAuthError"
    get:
      tags: [AppAuthentication]
      operationId: getDeviceAuthorizationForBrowser
      summary: 读取等待当前浏览器账户确认的客户端登录窗口
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: userCode
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-HJ-NP-Z2-9]{4}-?[A-HJ-NP-Z2-9]{4}$"
      responses:
        "200":
          description: 登录窗口与设备信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserDeviceAuthorization"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /oauth/device-authorization/approve:
    post:
      tags: [AppAuthentication]
      operationId: approveDeviceAuthorization
      summary: 将当前浏览器账户明确授权给客户端登录窗口
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAuthorizationDecisionRequest"
      responses:
        "200":
          description: 已批准，客户端可在下一次轮询时领取凭证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserDeviceAuthorization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /oauth/device-authorization/deny:
    post:
      tags: [AppAuthentication]
      operationId: denyDeviceAuthorization
      summary: 拒绝客户端登录窗口
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAuthorizationDecisionRequest"
      responses:
        "204":
          description: 已拒绝
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /oauth/token:
    post:
      tags: [AppAuthentication]
      operationId: exchangeAppToken
      summary: 轮询设备授权结果或轮换客户端刷新凭证
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AppTokenRequest"
      responses:
        "200":
          description: 已签发一组新的客户端凭证
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppTokenResponse"
        "400":
          $ref: "#/components/responses/OAuthError"
        "415":
          $ref: "#/components/responses/OAuthError"
        "503":
          $ref: "#/components/responses/OAuthError"
  /oauth/revoke:
    post:
      tags: [AppAuthentication]
      operationId: revokeAppToken
      summary: 退出并吊销一个客户端设备会话
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RevokeAppTokenRequest"
      responses:
        "204":
          description: 已完成吊销；未知令牌也返回相同结果
        "415":
          $ref: "#/components/responses/OAuthError"
        "503":
          $ref: "#/components/responses/OAuthError"
  /auth/mfa/totp/verify:
    post:
      tags: [Authentication]
      operationId: verifyLoginMFA
      summary: 完成登录后的 TOTP 或恢复码验证
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFACodeRequest"
      responses:
        "200":
          description: 验证成功；旧会话已撤销并下发保证级别为 2 的新会话
          headers:
            Set-Cookie:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccountResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutAccount
      summary: 撤销当前登录会话
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: 会话已撤销且认证 Cookie 已清除
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /auth/forgot-password:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: 请求发送密码重置邮件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: 请求已接收；响应不会泄露账户状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
  /auth/reset-password:
    post:
      tags: [Authentication]
      operationId: resetAccountPassword
      summary: 使用一次性令牌重置密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: 密码已重置，旧登录会话已全部撤销
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /me:
    get:
      tags: [Account]
      operationId: getCurrentAccount
      summary: 获取当前账户与授权上下文
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: 当前账户、权限和会话有效期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccountResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Account]
      operationId: updateCurrentAccount
      summary: 更新当前账户资料
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: 资料更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /me/password:
    patch:
      tags: [Account]
      operationId: changeCurrentAccountPassword
      summary: 使用当前密码修改账户密码
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 密码修改成功
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /me/mfa:
    get:
      tags: [Account]
      operationId: getCurrentAccountMFA
      summary: 获取当前账户的多因素验证状态
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 多因素验证状态与剩余恢复码数量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatusResponse"
        "401":
