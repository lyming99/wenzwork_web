        originalPriceMinor:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: 划线原价的最小货币单位整数；不展示原价时为 null，配置时必须高于 priceMinor。
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
