        downloadMode:
          type: string
          enum: [proxy_cached, s3_redirect, github_redirect]
        s3UrlPrefix:
          type: string
          description: S3 链接模式的公开对象前缀；直链和 GitHub 链接模式可为空。
        version:
          type: integer
          format: int64
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    UpdateReleaseDeliverySettingsRequest:
      type: object
      additionalProperties: false
      required: [downloadMode, s3UrlPrefix, expectedVersion]
      properties:
        downloadMode:
          type: string
          enum: [proxy_cached, s3_redirect, github_redirect]
        s3UrlPrefix:
          type: string
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
    ReleaseAccessKeySettings:
      type: object
      additionalProperties: false
      required: [accessKeyConfigured, keyPrefix, version, updatedAt]
