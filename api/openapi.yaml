          type: string
          maxLength: 64
        protocols:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 80
        activeConnections:
          type: integer
          format: int64
          minimum: 0
        activeFileTransfers:
          type: integer
          format: int64
          minimum: 0
        memoryBytes:
          type: integer
          format: int64
          minimum: 0
        ingressMbps:
          type: number
          minimum: 0
        egressMbps:
          type: number
          minimum: 0
        lastHeartbeatAt:
          type: string
          format: date-time
