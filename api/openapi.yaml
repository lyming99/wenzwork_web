    SessionID:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchID:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReleaseID:
      name: releaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PricingPlanID:
